<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self' blob:; font-src 'self' blob: data:; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'"
    />
    <title>论文阅读器</title>
    <link rel="stylesheet" href="node_modules/pdfjs-dist/web/pdf_viewer.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>论文阅读器</h1>
      <div class="toolbar-actions">
        <button id="model-settings" type="button">模型设置</button>
        <button id="open-pdf" type="button">打开 PDF</button>
      </div>
      <input id="pdf-file" type="file" accept=".pdf,application/pdf" hidden />
    </header>

    <main class="workspace">
      <section class="reader" aria-label="PDF 阅读区">
        <div class="reader-toolbar">
          <span id="file-name" class="file-name">尚未打开 PDF</span>
          <div class="page-controls" aria-label="翻页">
            <button id="previous-page" type="button" disabled>上一页</button>
            <span id="page-label">— / —</span>
            <button id="next-page" type="button" disabled>下一页</button>
          </div>
        </div>
        <p id="reader-status" class="reader-status" role="status" aria-live="polite"></p>
        <div id="page-scroll" class="page-scroll">
          <div id="empty-reader" class="empty-reader">
            <span class="paper-mark" aria-hidden="true">PDF</span>
            <h2 id="empty-title">打开一篇论文</h2>
            <p id="empty-description">点击右上角“打开 PDF”选择本地文件</p>
          </div>
          <div id="page-stage" class="page-stage" hidden>
            <canvas id="pdf-canvas" aria-hidden="true"></canvas>
            <div id="pdf-text-layer" class="textLayer" aria-label="PDF 文字层"></div>
          </div>
        </div>
      </section>

      <aside class="translation" aria-label="翻译区">
        <section class="text-pane" aria-labelledby="source-heading">
          <h2 id="source-heading">原文</h2>
          <p id="source-text" class="source-text">选中的文字会显示在这里</p>
        </section>
        <section class="text-pane" aria-labelledby="result-heading">
          <div class="pane-heading">
            <h2 id="result-heading">译文</h2>
            <div class="toolbar-actions">
              <button id="translate" type="button" disabled>翻译</button>
              <button id="stop-translation" type="button" hidden>停止</button>
            </div>
          </div>
          <p id="translation-status" class="translation-status" role="status" aria-live="polite"></p>
          <p id="translation-text" class="translation-text">翻译结果会显示在这里</p>
        </section>
      </aside>
    </main>
    <dialog id="settings-dialog" aria-labelledby="settings-heading">
      <form id="settings-form" autocomplete="off">
        <h2 id="settings-heading">模型设置</h2>
        <label for="api-base">接口基础地址</label>
        <input id="api-base" type="url" required value="https://api.deepseek.com/v1" />
        <label for="api-model">模型名称</label>
        <input id="api-model" required maxlength="200" value="deepseek-flash" />
        <label for="api-key">API 密钥</label>
        <input id="api-key" type="password" autocomplete="new-password" required />
        <p class="settings-note">配置仅本次运行有效，关闭后需重新填写密钥。模型调用由服务商计费。</p>
        <p id="settings-status" class="translation-status" role="status"></p>
        <div class="settings-actions">
          <button id="cancel-settings" type="button">取消</button>
          <button id="save-settings" type="submit">使用配置</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="reader.js"></script>
  </body>
</html>
